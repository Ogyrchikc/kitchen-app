<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchen AI — Умная кухня</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181b22;
      --card-border: #262a35;
      --text-main: #f1f3f7;
      --text-muted: #8b949e;
      --accent-green: #34d399;
      --accent-green-dim: rgba(52, 211, 153, 0.12);
      --accent-orange: #fbbf24;
      --accent-red: #f87171;
      --accent-blue: #60a5fa;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Адаптация под системную тему Telegram, если запущено внутри мессенджера */
    body {
      background-color: var(--tg-theme-bg-color, var(--bg-color));
      color: var(--tg-theme-text-color, var(--text-main));
      font-family: var(--font-family);
      margin: 0;
      padding: 0 0 80px 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    header {
      padding: 18px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(15, 17, 21, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 24px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .room-badge {
      font-size: 12px;
      color: var(--accent-green);
      background: var(--accent-green-dim);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    /* Навигация вкладками (Tabs) */
    .tabs-content {
      padding: 16px 16px 0;
    }

    .tab-pane {
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    .tab-pane.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Карточки продуктов */
    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .item-card:active {
      transform: scale(0.985);
      border-color: #3b4252;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .item-emoji {
      font-size: 24px;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expiry-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 500;
    }

    .expiry-ok { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
    .expiry-soon { background: rgba(251, 191, 36, 0.15); color: var(--accent-orange); }
    .expiry-expired { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); }

    .item-qty {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
    }

    /* Чеклист покупок (One-handed mode) */
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .checklist-item.checked {
      opacity: 0.45;
      background: rgba(24, 27, 34, 0.5);
      border-color: transparent;
    }

    .checklist-item.checked .check-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .checklist-item.checked .custom-checkbox {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    .custom-checkbox svg {
      display: none;
      width: 14px;
      height: 14px;
      stroke: #0f1115;
      stroke-width: 3;
    }

    .checklist-item.checked .custom-checkbox svg {
      display: block;
    }

    .check-text {
      font-size: 15px;
      font-weight: 500;
      flex: 1;
    }

    /* Быстрые действия / кнопка добавления */
    .action-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }

    .quick-input-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .quick-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
    }

    .quick-input:focus {
      border-color: var(--accent-blue);
    }

    .btn-add {
      background: var(--accent-green);
      color: #0f1115;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }

    .btn-add:active {
      opacity: 0.8;
    }

    /* Рецепты за 5 минут */
    .recipe-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .recipe-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .recipe-time {
      font-size: 12px;
      color: var(--accent-orange);
      background: rgba(251, 191, 36, 0.1);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
      white-space: nowrap;
    }

    .recipe-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .recipe-tag {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    /* Нижняя панель навигации (Bottom Bar) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(15, 17, 21, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
      transition: color 0.15s;
    }

    .nav-btn.active {
      color: var(--accent-green);
    }

    .nav-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Хедер -->
  <header>
    <div class="brand">
      <span class="brand-icon">🍳</span>
      <span class="brand-title">Kitchen AI</span>
    </div>
    <div class="room-badge">Комната 1</div>
  </header>

  <!-- Контент вкладок -->
  <main class="tabs-content">

    <!-- Вкладка 1: Холодильник -->
    <section id="tab-fridge" class="tab-pane active">
      <div class="action-bar">
        <div class="quick-input-box">
          <input type="text" id="fridgeInput" class="quick-input" placeholder="Добавить продукт (напр. Сыр 200г)...">
          <button class="btn-add" onclick="addProduct()">+</button>
        </div>
      </div>

      <div class="card-grid" id="fridgeList">
        <!-- Генерируется через JS -->
      </div>
    </section>

    <!-- Вкладка 2: Корзина / Список покупок -->
    <section id="tab-cart" class="tab-pane">
      <div class="action-bar">
        <div class="quick-input-box">
          <input type="text" id="cartInput" class="quick-input" placeholder="Купить в Магните...">
          <button class="btn-add" onclick="addCartItem()">+</button>
        </div>
      </div>

      <div id="cartList">
        <!-- Генерируется через JS -->
      </div>
    </section>

    <!-- Вкладка 3: Рецепты на скорую руку -->
    <section id="tab-recipes" class="tab-pane">
      <div class="card-grid" id="recipesList">
        <!-- Карточки рецептов -->
      </div>
    </section>

  </main>

  <!-- Нижняя панель навигации -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('fridge', this)">
      <span class="nav-icon">🧊</span>
      <span>Холодильник</span>
    </button>
    <button class="nav-btn" onclick="switchTab('cart', this)">
      <span class="nav-icon">🛒</span>
      <span>Покупки</span>
    </button>
    <button class="nav-btn" onclick="switchTab('recipes', this)">
      <span class="nav-icon">⚡️</span>
      <span>За 5 минут</span>
    </button>
  </nav>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем на весь экран
      tg.enableClosingConfirmation(); // Защита от случайного смахивания
    }

    // Тактильный виброотклик (Haptic Feedback)
    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Демо-данные (синхронизированы с базой общаги)
    let fridgeData = [
      { id: 1, name: 'Куриное филе', qty: '800 гр', emoji: '🍗', expiry: 'до 22 авг', status: 'ok' },
      { id: 2, name: 'Яйца С1', qty: '10 шт', emoji: '🥚', expiry: 'свежие', status: 'ok' },
      { id: 3, name: 'Молоко 3.2%', qty: '1000 мл', emoji: '🥛', expiry: 'открыто', status: 'soon' },
      { id: 4, name: 'Сыр Российский', qty: '250 гр', emoji: '🧀', expiry: 'годен', status: 'ok' }
    ];

    let cartData = [
      { id: 101, name: 'Ультрапастеризованное молоко (для йогуртницы)', checked: false },
      { id: 102, name: 'Греческий йогурт Теос (закваска)', checked: false },
      { id: 103, name: 'Рис пропаренный 1 кг', checked: true },
      { id: 104, name: 'Приправа для плова', checked: false }
    ];

    const recipesData = [
      {
        title: 'Ленивый студенческий плов',
        time: '5 мин преп / 35 мин',
        device: 'Мультиварка',
        desc: 'Курица на дно, сверху рис, вода на 1.5 см выше и головка чеснока. Не перемешивать!'
      },
      {
        title: 'Макароны без дуршлага с сыром',
        time: '7 минут',
        device: 'Мультиварка',
        desc: 'Залить кипятком ровно вровень с макаронами. Вода впитается без остатка — сразу посыпать сыром.'
      },
      {
        title: 'Хрустящие голени в специях',
        time: '3 мин преп / 20 мин',
        device: 'Аэрогриль',
        desc: 'Посолить, поперчить и закинуть при 190°C на 20 минут. Ноль грязной посуды.'
      }
    ];

    // Рендер холодильника
    function renderFridge() {
      const container = document.getElementById('fridgeList');
      container.innerHTML = fridgeData.map(item => `
        <div class="item-card">
          <div class="item-left">
            <div class="item-emoji">${item.emoji}</div>
            <div class="item-info">
              <span class="item-name">${item.name}</span>
              <div class="item-meta">
                <span class="expiry-tag expiry-${item.status}">${item.expiry}</span>
              </div>
            </div>
          </div>
          <div class="item-qty">${item.qty}</div>
        </div>
      `).join('');
    }

    // Рендер покупок
    function renderCart() {
      const container = document.getElementById('cartList');
      container.innerHTML = cartData.map(item => `
        <div class="checklist-item ${item.checked ? 'checked' : ''}" onclick="toggleCart(${item.id})">
          <div class="custom-checkbox">
            <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="check-text">${item.name}</span>
        </div>
      `).join('');
    }

    // Рендер рецептов
    function renderRecipes() {
      const container = document.getElementById('recipesList');
      container.innerHTML = recipesData.map(r => `
        <div class="recipe-card">
          <div class="recipe-header">
            <span class="recipe-title">${r.title}</span>
            <span class="recipe-time">⏱ ${r.time}</span>
          </div>
          <div class="recipe-desc">${r.desc}</div>
          <span class="recipe-tag">🔥 ${r.device}</span>
        </div>
      `).join('');
    }

    // Переключение вкладок
    function switchTab(tabId, btn) {
      haptic('light');
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabId}`).classList.add('active');
      btn.classList.add('active');
    }

    // Чекнуть товар в магазине
    function toggleCart(id) {
      haptic('medium');
      const item = cartData.find(i => i.id === id);
      if (item) {
        item.checked = !item.checked;
        renderCart();
      }
    }

    // Добавить продукт в холодильник
    function addProduct() {
      const input = document.getElementById('fridgeInput');
      const text = input.value.trim();
      if (!text) return;

      haptic('heavy');
      fridgeData.unshift({
        id: Date.now(),
        name: text,
        qty: '1 шт',
        emoji: '📦',
        expiry: 'свежее',
        status: 'ok'
      });
      input.value = '';
      renderFridge();
    }

    // Добавить в корзину
    function addCartItem() {
      const input = document.getElementById('cartInput');
      const text = input.value.trim();
      if (!text) return;

      haptic('heavy');
      cartData.unshift({
        id: Date.now(),
        name: text,
        checked: false
      });
      input.value = '';
      renderCart();
    }

    // Первоначальная отрисовка
    renderFridge();
    renderCart();
    renderRecipes();
  </script>
</body>
</html>
